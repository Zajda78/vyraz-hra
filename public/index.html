  <meta name="theme-color" content="#130A24">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
  <div id="splash" class="sf-splash" role="status" aria-label="Loading Snapfam">
    <span class="sf-splash-blob sf-splash-blob-a"></span>
    <span class="sf-splash-blob sf-splash-blob-b"></span>
    <div class="sf-splash-main">
      <svg width="128" height="128" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#3A1F7E"/><path d="M9 15v-4a2 2 0 0 1 2-2h4M25 9h4a2 2 0 0 1 2 2v4M31 25v4a2 2 0 0 1-2 2h-4M15 31h-4a2 2 0 0 1-2-2v-4" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="20" cy="20" r="8" fill="#FFD23F"/><circle cx="17.2" cy="18.3" r="1.2" fill="#3A2500"/><circle cx="22.8" cy="18.3" r="1.2" fill="#3A2500"/><path d="M16 21.2h8a4 4 0 0 1-8 0z" fill="#3A2500"/></svg>
      <div class="sf-splash-word">Snapfam</div>
      <div class="sf-splash-tag">Snap it. Vote it. Win it.</div>
    </div>
    <div class="sf-splash-wait">
      <div class="sf-splash-dots" aria-hidden="true"><span style="background:#FF8A3D"></span><span style="background:#3FC46A;animation-delay:.15s"></span><span style="background:#B99CFF;animation-delay:.3s"></span><span style="background:#FFD23F;animation-delay:.45s"></span></div>
      <div class="sf-splash-msg">Waking up the party…</div>
    </div>
    <div class="sf-splash-crew" aria-hidden="true">
      <svg class="peek" style="left:8px;bottom:-26px" width="96" height="120" viewBox="0 0 96 120"><circle cx="48" cy="60" r="44" fill="#FF8A3D" stroke="#8F4110" stroke-width="5"/><path d="M14 46C18 18 78 18 82 46C70 34 26 34 14 46Z" fill="#4A2511" stroke="#8F4110" stroke-width="5"/><circle cx="34" cy="58" r="5" fill="#2A1408"/><circle cx="62" cy="58" r="5" fill="#2A1408"/><path d="M34 74h28a14 14 0 0 1-28 0z" fill="#5A1A1A"/></svg>
      <svg class="peek" style="left:96px;bottom:-40px;animation-delay:.4s" width="90" height="120" viewBox="0 0 96 120"><circle cx="48" cy="60" r="44" fill="#3FC46A" stroke="#1D6B39" stroke-width="5"/><circle cx="34" cy="56" r="8" fill="#fff" stroke="#1D6B39" stroke-width="4"/><circle cx="62" cy="56" r="8" fill="#fff" stroke="#1D6B39" stroke-width="4"/><circle cx="34" cy="57" r="3" fill="#12301D"/><circle cx="62" cy="57" r="3" fill="#12301D"/><ellipse cx="48" cy="80" rx="7" ry="9" fill="#12301D"/></svg>
      <svg class="peek" style="right:96px;bottom:-34px;animation-delay:.8s" width="90" height="120" viewBox="0 0 96 120"><circle cx="48" cy="60" r="44" fill="#8B5CF6" stroke="#2C1670" stroke-width="5"/><path d="M28 56h14M56 56h12" stroke="#1B1530" stroke-width="5" stroke-linecap="round"/><path d="M34 76q16 8 30-6" stroke="#1B1530" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
      <svg class="peek" style="right:8px;bottom:-22px;animation-delay:1.2s" width="96" height="120" viewBox="0 0 96 120"><circle cx="48" cy="60" r="44" fill="#FFD23F" stroke="#8C6600" stroke-width="5"/><circle cx="48" cy="16" r="12" fill="#C2531B" stroke="#8C6600" stroke-width="5"/><path d="M28 58q6-6 12 0M56 58q6-6 12 0" stroke="#3A2500" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M32 72h32a16 16 0 0 1-32 0z" fill="#5A1A1A"/></svg>
    </div>
  </div>
  <div id="app"></div>

  <script src="dev.js"></script>

  <script src="shop.js"></script>
