<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#2E1065"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9A8D4"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <rect width="192" height="192" rx="42" fill="url(#shine)"/>

  <!-- kresba v původních souřadnicích návrhu, zmenšená do ikonky -->
  <g transform="translate(-17 17) scale(0.43)" stroke-linecap="round" stroke-linejoin="round">
    <!-- foťák -->
    <path d="M160 150 L178 126 H252 L270 150" fill="#1C1231" stroke="#fff" stroke-width="22"/>
    <rect x="85" y="150" width="255" height="180" rx="36" fill="#1C1231" stroke="#fff" stroke-width="22"/>
    <circle cx="124" cy="186" r="13" fill="none" stroke="#fff" stroke-width="10"/>
    <!-- objektiv -->
    <circle cx="213" cy="250" r="68" fill="none" stroke="#fff" stroke-width="20"/>
    <circle cx="213" cy="250" r="44" fill="url(#lens)"/>
    <circle cx="198" cy="235" r="11" fill="#fff" fill-opacity="0.55"/>
    <!-- hvězdička na rohu foťáku -->
    <polygon points="296.0,156.0 303.6,177.5 326.4,178.1 308.4,192.0 314.8,213.9 296.0,201.0 277.2,213.9 283.6,192.0 265.6,178.1 288.4,177.5"
             fill="url(#star)" stroke="#1C1231" stroke-width="5"/>
    <!-- obličej -->
    <circle cx="384" cy="96" r="62" fill="url(#face)" stroke="#fff" stroke-width="14"/>
    <ellipse cx="362" cy="86" rx="7" ry="10" fill="#1C1231"/>
    <ellipse cx="404" cy="96" rx="7" ry="10" fill="#1C1231"/>
    <path d="M352 120 L390 131" fill="none" stroke="#1C1231" stroke-width="10"/>
  </g>
</svg>
